name: Build & Deploy

# Never publish the pointer concurrently with another promotion.
concurrency:
  group: arckon-server-deployment
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm_gcp_upload:
        description: Type PROMOTE_SIGNED_RELEASE to promote one signed release to GCS.
        required: true
        type: string
      release_tag:
        description: Published signed release tag to promote (for example v1.0.10).
        required: true
        type: string

jobs:
  build-and-deploy:
    if: inputs.confirm_gcp_upload == 'PROMOTE_SIGNED_RELEASE'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Validate exact tagged checkout
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "${TAG#v}" = "$(python -c 'from arckon_version import VERSION; print(VERSION)')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full test suite
        env:
          SECRET_KEY: ci-only-synthetic-secret-key-not-for-production
        run: |
          python -m pip install -r requirements.txt -r admin/requirements.txt pytest httpx
          python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile binaries (linux/amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file scripts/Dockerfile.build \
            --output type=local,dest=dist \
            .
          echo "=== Built binaries ==="
          ls -lh dist/

      - name: Assemble one verified multi-platform release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${TAG#v}"
          test "$VERSION" = "$(python -c 'from arckon_version import VERSION; print(VERSION)')"

          ASSETS="$RUNNER_TEMP/release-assets"
          CATALOG="$RUNNER_TEMP/catalog"
          mkdir "$ASSETS"
          gh release download "$TAG" --dir "$ASSETS" \
            --pattern 'arckon-agent-*.tar.gz' \
            --pattern '*-manifest.json' \
            --pattern '*-manifest.sig'

          for platform in linux macos windows; do
            mkdir -p "$CATALOG/$platform"
            cp "$ASSETS/${platform}-manifest.json" "$CATALOG/$platform/manifest.json"
            cp "$ASSETS/${platform}-manifest.sig" "$CATALOG/$platform/manifest.sig"
            cp "$ASSETS/arckon-agent-${VERSION}-${platform}"*.tar.gz "$CATALOG/$platform/"
          done

          mkdir -p "$RUNNER_TEMP/deployment"
          python - <<'PY'
          from pathlib import Path
          import os
          from arckon_version import VERSION
          from scripts.promote_deployment import pack_catalog
          root = Path(os.environ['RUNNER_TEMP'])
          pack_catalog(root / 'catalog', root / 'deployment/catalog.tar.gz', VERSION)
          PY

      - name: Build and archive complete tenant and admin images
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          docker buildx build --platform linux/amd64 --load -f Dockerfile -t "arckon-tenant:$REVISION" .
          docker buildx build --platform linux/amd64 --load -f admin/Dockerfile -t "arckon-admin:$REVISION" .
          mkdir -p "$RUNNER_TEMP/deployment"
          docker image inspect --format '{{.Id}}' "arckon-tenant:$REVISION" > "$RUNNER_TEMP/tenant-id"
          docker image inspect --format '{{.Id}}' "arckon-admin:$REVISION" > "$RUNNER_TEMP/admin-id"
          docker save "$(<"$RUNNER_TEMP/tenant-id")" | gzip -n > "$RUNNER_TEMP/deployment/tenant.docker.tar.gz"
          docker save "$(<"$RUNNER_TEMP/admin-id")" | gzip -n > "$RUNNER_TEMP/deployment/admin.docker.tar.gz"

      - name: Sign and verify complete deployment
        env:
          ARCKON_RELEASE_SIGNING_KEY: ${{ secrets.ARCKON_RELEASE_SIGNING_KEY }}
        run: |
          python scripts/promote_deployment.py create --directory "$RUNNER_TEMP/deployment" \
            --revision "$(git rev-parse HEAD)" \
            --version "$(python -c 'from arckon_version import VERSION; print(VERSION)')" \
            --tenant-image "$(<"$RUNNER_TEMP/tenant-id")" --admin-image "$(<"$RUNNER_TEMP/admin-id")"
          python scripts/promote_deployment.py verify --directory "$RUNNER_TEMP/deployment"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS deploy bucket
        run: |
          set -euo pipefail
          PREFIX="gs://arckon-deploy-artifacts/deployments/$(git rev-parse HEAD)"
          # A duplicate revision is an error, never silently skipped/overwritten.
          for artifact in tenant.docker.tar.gz admin.docker.tar.gz catalog.tar.gz manifest.json manifest.sig; do
            gcloud storage cp --if-generation-match=0 "$RUNNER_TEMP/deployment/$artifact" "$PREFIX/$artifact"
          done
          # Mutable pointer contains only a revision, not URLs or executable code.
          # Publish last, only after every immutable object upload succeeds.
          gcloud storage cp "$RUNNER_TEMP/deployment/deployment.json" gs://arckon-deploy-artifacts/latest/deployment.json
