---
# Install and configure the Arckon agent on Linux hosts.
# Downloads the Nuitka-compiled binary from the Arckon server.
- name: Create arckon system user
  user:
    name: "{{ arckon_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create install directory
  file:
    path: "{{ arckon_install_prefix }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create config directory
  file:
    path: "{{ arckon_config_dir }}"
    state: directory
    owner: root
    group: "{{ arckon_user }}"
    mode: "0750"

- name: Fetch release manifest
  uri:
    url: "{{ arckon_server }}/releases/linux/manifest.json"
    method: GET
    headers:
      Authorization: "Bearer {{ arckon_token }}"
    return_content: true
  register: arckon_manifest

- name: Parse manifest
  set_fact:
    arckon_artifact: "{{ arckon_manifest.json.artifact }}"
    arckon_version: "{{ arckon_manifest.json.version }}"
    arckon_sha256: "{{ arckon_manifest.json.sha256 }}"

- name: Download agent release
  get_url:
    url: "{{ arckon_server }}/releases/linux/{{ arckon_artifact }}"
    dest: "/tmp/{{ arckon_artifact }}"
    headers:
      Authorization: "Bearer {{ arckon_token }}"
    checksum: "sha256:{{ arckon_sha256 }}"
    mode: "0644"

- name: Extract agent release
  unarchive:
    src: "/tmp/{{ arckon_artifact }}"
    dest: "{{ arckon_install_prefix }}"
    remote_src: true
    extra_opts: "--strip-components=1"

- name: Ensure binaries are executable
  file:
    path: "{{ arckon_install_prefix }}/{{ item }}"
    mode: "0755"
    owner: "{{ arckon_user }}"
    group: "{{ arckon_user }}"
  loop:
    - agent
    - audit

- name: Create agent config
  copy:
    content: |
      {
        "server": "{{ arckon_server }}",
        "token": "{{ arckon_token }}",
        "target": "{{ arckon_target }}",
        "profile": "{{ arckon_profile }}",
        "interval": {{ arckon_interval }}
      }
    dest: "{{ arckon_config_file }}"
    owner: root
    group: "{{ arckon_user }}"
    mode: "0640"

- name: Install systemd service
  template:
    src: arckon-agent.service.j2
    dest: "/etc/systemd/system/{{ arckon_service_name }}.service"
    mode: "0644"
  notify: restart arckon-agent

- name: Enable and start service
  systemd:
    name: "{{ arckon_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Clean up downloaded artifact
  file:
    path: "/tmp/{{ arckon_artifact }}"
    state: absent