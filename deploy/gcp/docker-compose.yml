services:
  nginx:
    image: nginx:alpine
    container_name: sentinel-nginx
    ports:
      - "80:80"
      # Existing customer vhosts use dedicated ports. The backend capability
      # check prevents direct callers from forging proxy-authenticated identity
      # while hostname/TLS ingress is introduced in a separate migration.
      - "7001-7100:7001-7100"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /opt/sentinel-nginx/proxy-tokens:/etc/nginx/proxy-tokens:ro
    networks:
      - sentinel-net
    restart: always
    depends_on:
      - user-manager

  user-manager:
    build:
      context: ../..
      dockerfile: admin/Dockerfile
    container_name: sentinel-admin
    environment:
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - DEPLOY_TOKEN_FILE=/run/secrets/deploy_token
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - PUBLIC_IP=${PUBLIC_IP}
      - PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-https://admin.riskraven.ai}
      - PUBLIC_DASHBOARD_URL=${PUBLIC_DASHBOARD_URL:-https://arckon.riskraven.ai}
      - PUBLIC_DASHBOARD_PORT=${PUBLIC_DASHBOARD_PORT:-7001}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.riskraven.ai}
      - DB_PATH=/data/sentinel.db
      - MAX_CUSTOMERS=${MAX_CUSTOMERS:-0}
      - LICENSES_DIR=/licenses
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ALERT_FROM=${ALERT_FROM:-}
      - ALERT_TO=${ALERT_TO:-}
      - MONITOR_INTERVAL_H=${MONITOR_INTERVAL_H:-24}
    volumes:
      - /opt/sentinel-data:/data
      - /opt/sentinel-secrets/admin-secret-key:/run/secrets/secret_key:ro
      - /opt/sentinel-secrets/deployer-token:/run/secrets/deploy_token:ro
      - /opt/sentinel-secrets/admin-password:/run/secrets/admin_password:ro
      - /opt/licenses:/licenses
    networks:
      - sentinel-net
    restart: always

  deployer:
    build: ./deployer
    container_name: sentinel-deployer
    environment:
      - DEPLOY_TOKEN_FILE=/run/secrets/deploy_token
    volumes:
      - /opt/sentinel:/opt/sentinel:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /opt/sentinel-secrets/deployer-token:/run/secrets/deploy_token:ro
    networks:
      - sentinel-net
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinel-cloudflared
    # The token stays in a root-owned host file. It is deliberately not an
    # environment variable, which Docker would expose through inspect.
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    volumes:
      - /opt/sentinel-secrets/cloudflare-tunnel-token:/run/secrets/cloudflare_tunnel_token:ro
    networks:
      - sentinel-net
    restart: always
    depends_on:
      - nginx

networks:
  sentinel-net:
    name: sentinel-net
    driver: bridge
