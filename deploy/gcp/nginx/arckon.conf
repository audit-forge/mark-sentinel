# Multi-tenant shared-hostname gateway for arckon.riskraven.ai.
#
# All customers reach the dashboard through this single vhost. nginx
# authenticates the user via /auth/verify, captures the customer_id from the
# auth response, and routes to the correct customer container dynamically.
#
# Customer isolation is enforced at three layers:
#   1. /auth/verify returns the user's own customer_id from the JWT
#   2. nginx routes to sentinel-{customer_id}:7331 — a user from customer A
#      can never reach customer B's container because the upstream is derived
#      from the authenticated customer_id, not from the URL or a cookie.
#   3. server.py scopes all data queries to the customer_id from the proxy
#      header, which nginx sets from the same authenticated value.
#
# Agent/bundle/releases routes use /auth/agent-lookup to resolve the bearer
# token to a customer_id and route to the right container.

# Map: authenticated customer_id -> upstream container hostname.
# Docker DNS (resolver 127.0.0.11) resolves sentinel-{customer_id} on the
# sentinel-net bridge.
map $sentinel_customer_id $sentinel_upstream {
    default "";
    "~^(?<cid>[a-zA-Z0-9_-]+)$" "sentinel-$cid:7331";
}

# Proxy tokens map: customer_id -> that customer's proxy token value.
# Generated by provision_customer.sh / restart_customer.sh.
include /etc/nginx/proxy-tokens/gateway-map.conf;

server {
    listen 80;
    server_name arckon.riskraven.ai;

    resolver 127.0.0.11 valid=30s;

    # ── Auth subrequests ───────────────────────────────────────────────────
    # Dashboard auth: validates the JWT session cookie and returns the user's
    # identity headers. No X-Customer-ID is sent — the gateway is shared, so
    # auth_verify returns the user's own customer_id from the JWT.
    location = /_auth {
        internal;
        proxy_pass http://sentinel-admin:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Agent-token auth: resolves the Bearer token to a customer_id for routing.
    # Returns 200 + X-Sentinel-Customer-ID, or 401.
    location = /_agent_auth {
        internal;
        proxy_pass http://sentinel-admin:8000/auth/agent-lookup;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # ── Agent/bundle/releases routes (bearer-token auth, no session cookie) ─
    # These bypass dashboard auth_request. They use the agent's Bearer token
    # to resolve the customer via /_agent_auth, then route to that customer's
    # container. All identity headers (both X-Sentinel-* and X-Arckon-*
    # spellings) are blanked so a caller cannot forge an admin or
    # cross-tenant identity.
    location /api/agent/ {
        auth_request /_agent_auth;
        auth_request_set $sentinel_customer_id $upstream_http_x_sentinel_customer_id;

        proxy_pass http://$sentinel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Sentinel-Proxy-Token $sentinel_proxy_token;
        proxy_set_header X-Sentinel-User-Email      "";
        proxy_set_header X-Sentinel-User-Role       "";
        proxy_set_header X-Sentinel-Customer-ID     "";
        proxy_set_header X-Sentinel-Client-Org-ID   "";
        proxy_set_header X-Sentinel-Is-Reseller     "";
        proxy_set_header X-Sentinel-Is-MSP          "";
        proxy_set_header X-Sentinel-Impersonated-By "";
        proxy_set_header X-Arckon-User-Email        "";
        proxy_set_header X-Arckon-User-Role         "";
        proxy_set_header X-Arckon-Customer-ID       "";
        proxy_set_header X-Arckon-Client-Org-ID     "";
        proxy_set_header X-Arckon-Is-Reseller       "";
        proxy_set_header X-Arckon-Is-MSP            "";
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location ~ ^/(bundle\.tar\.gz|agent\.py)$ {
        auth_request /_agent_auth;
        auth_request_set $sentinel_customer_id $upstream_http_x_sentinel_customer_id;

        proxy_pass http://$sentinel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Sentinel-Proxy-Token $sentinel_proxy_token;
        proxy_set_header X-Sentinel-User-Email      "";
        proxy_set_header X-Sentinel-User-Role       "";
        proxy_set_header X-Sentinel-Customer-ID     "";
        proxy_set_header X-Sentinel-Client-Org-ID   "";
        proxy_set_header X-Sentinel-Is-Reseller     "";
        proxy_set_header X-Sentinel-Is-MSP          "";
        proxy_set_header X-Sentinel-Impersonated-By "";
        proxy_set_header X-Arckon-User-Email        "";
        proxy_set_header X-Arckon-User-Role         "";
        proxy_set_header X-Arckon-Customer-ID       "";
        proxy_set_header X-Arckon-Client-Org-ID     "";
        proxy_set_header X-Arckon-Is-Reseller       "";
        proxy_set_header X-Arckon-Is-MSP            "";
        proxy_read_timeout 300;
    }

    location /releases/ {
        auth_request /_agent_auth;
        auth_request_set $sentinel_customer_id $upstream_http_x_sentinel_customer_id;

        proxy_pass http://$sentinel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Sentinel-Proxy-Token $sentinel_proxy_token;
        proxy_set_header X-Sentinel-User-Email      "";
        proxy_set_header X-Sentinel-User-Role       "";
        proxy_set_header X-Sentinel-Customer-ID     "";
        proxy_set_header X-Sentinel-Client-Org-ID   "";
        proxy_set_header X-Sentinel-Is-Reseller     "";
        proxy_set_header X-Sentinel-Is-MSP          "";
        proxy_set_header X-Sentinel-Impersonated-By "";
        proxy_set_header X-Arckon-User-Email        "";
        proxy_set_header X-Arckon-User-Role         "";
        proxy_set_header X-Arckon-Customer-ID       "";
        proxy_set_header X-Arckon-Client-Org-ID     "";
        proxy_set_header X-Arckon-Is-Reseller       "";
        proxy_set_header X-Arckon-Is-MSP            "";
        proxy_read_timeout 300;
    }

    # ── Install route (no auth — install scripts are public) ──────────────
    location /install/ {
        proxy_pass http://sentinel-admin:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Sentinel-Proxy-Token "";
        proxy_set_header X-Sentinel-User-Email      "";
        proxy_set_header X-Sentinel-User-Role       "";
        proxy_set_header X-Sentinel-Customer-ID     "";
        proxy_set_header X-Sentinel-Client-Org-ID   "";
        proxy_set_header X-Sentinel-Is-Reseller     "";
        proxy_set_header X-Sentinel-Is-MSP          "";
        proxy_set_header X-Sentinel-Impersonated-By "";
        proxy_set_header X-Arckon-User-Email        "";
        proxy_set_header X-Arckon-User-Role         "";
        proxy_set_header X-Arckon-Customer-ID       "";
        proxy_set_header X-Arckon-Client-Org-ID     "";
        proxy_set_header X-Arckon-Is-Reseller       "";
        proxy_set_header X-Arckon-Is-MSP            "";
    }

    # ── Dashboard API (session-cookie auth) ───────────────────────────────
    location /api/ {
        auth_request /_auth;
        auth_request_set $sentinel_user_email      $upstream_http_x_sentinel_user_email;
        auth_request_set $sentinel_user_role       $upstream_http_x_sentinel_user_role;
        auth_request_set $sentinel_customer_id     $upstream_http_x_sentinel_customer_id;
        auth_request_set $sentinel_client_org_id   $upstream_http_x_sentinel_client_org_id;
        auth_request_set $sentinel_is_reseller     $upstream_http_x_sentinel_is_reseller;
        auth_request_set $sentinel_is_msp          $upstream_http_x_sentinel_is_msp;
        auth_request_set $sentinel_impersonated_by $upstream_http_x_sentinel_impersonated_by;

        proxy_pass http://$sentinel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Sentinel-Proxy-Token $sentinel_proxy_token;
        proxy_set_header X-Sentinel-User-Email      $sentinel_user_email;
        proxy_set_header X-Sentinel-User-Role       $sentinel_user_role;
        proxy_set_header X-Sentinel-Customer-ID     $sentinel_customer_id;
        proxy_set_header X-Sentinel-Client-Org-ID   $sentinel_client_org_id;
        proxy_set_header X-Sentinel-Is-Reseller     $sentinel_is_reseller;
        proxy_set_header X-Sentinel-Is-MSP          $sentinel_is_msp;
        proxy_set_header X-Sentinel-Impersonated-By $sentinel_impersonated_by;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # ── Dashboard UI (session-cookie auth) ─────────────────────────────────
    location / {
        auth_request /_auth;
        error_page 401 403 = @login_redirect;
        # Every X-Sentinel-* header /auth/verify emits must be captured here
        # AND re-set below. A header that is captured but not proxy_set_header'd
        # is silently replaced by whatever the browser sent; a client_viewer
        # whose Client-Org-ID never arrives is what let one tenant read the
        # whole MSP fleet.
        auth_request_set $sentinel_user_email      $upstream_http_x_sentinel_user_email;
        auth_request_set $sentinel_user_role       $upstream_http_x_sentinel_user_role;
        auth_request_set $sentinel_customer_id     $upstream_http_x_sentinel_customer_id;
        auth_request_set $sentinel_client_org_id   $upstream_http_x_sentinel_client_org_id;
        auth_request_set $sentinel_is_reseller     $upstream_http_x_sentinel_is_reseller;
        auth_request_set $sentinel_is_msp          $upstream_http_x_sentinel_is_msp;
        auth_request_set $sentinel_impersonated_by $upstream_http_x_sentinel_impersonated_by;

        proxy_pass http://$sentinel_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Sentinel-Proxy-Token $sentinel_proxy_token;
        proxy_set_header X-Sentinel-User-Email      $sentinel_user_email;
        proxy_set_header X-Sentinel-User-Role       $sentinel_user_role;
        proxy_set_header X-Sentinel-Customer-ID     $sentinel_customer_id;
        proxy_set_header X-Sentinel-Client-Org-ID   $sentinel_client_org_id;
        proxy_set_header X-Sentinel-Is-Reseller     $sentinel_is_reseller;
        proxy_set_header X-Sentinel-Is-MSP          $sentinel_is_msp;
        proxy_set_header X-Sentinel-Impersonated-By $sentinel_impersonated_by;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location @login_redirect {
        return 302 https://admin.riskraven.ai/login?next=https://arckon.riskraven.ai$request_uri;
    }
}